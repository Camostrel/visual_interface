<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" width="120" height="120" role="img" aria-label="wall panel">
  <!-- Единый стиль иконок устройств: панель-градиент + гравировка (как motion.svg). -->
  <defs>
    <style>
      .panel-base { fill: url(#panel-gradient); }
      .panel-highlight { fill: url(#panel-highlight); opacity: .78; isolation: isolate; }
      .icon-main { fill: none; stroke: #6f8fac; stroke-width: 2.7; stroke-linecap: round; stroke-linejoin: round; }
      .icon-soft { fill: none; stroke: #8ea8bf; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
    </style>
    <linearGradient id="panel-gradient" x1="10" y1="10" x2="110" y2="110" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#f2f6fa"/>
      <stop offset="0.52" stop-color="#e7edf3"/>
      <stop offset="1" stop-color="#dce4ec"/>
    </linearGradient>
    <linearGradient id="panel-highlight" x1="14" y1="14" x2="106" y2="106" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".68"/>
      <stop offset="0.5" stop-color="#ffffff" stop-opacity=".12"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <g id="device-panel">
    <rect class="panel-base" x="10" y="10" width="100" height="100" rx="23" ry="23"/>
    <rect class="panel-highlight" x="14" y="14" width="92" height="92" rx="20" ry="20"/>
  </g>
  <g id="device-icon" aria-hidden="true">
    <!-- Настенная панель: рамка, поворотная ручка с меткой и две кнопки -->
    <rect class="icon-main" x="38" y="33" width="44" height="54" rx="6"/>
    <circle class="icon-main" cx="60" cy="53" r="9.5"/>
    <line class="icon-soft" x1="60" y1="53" x2="60" y2="46"/>
    <rect class="icon-soft" x="45" y="70" width="13" height="8.5" rx="2.5"/>
    <rect class="icon-soft" x="62" y="70" width="13" height="8.5" rx="2.5"/>
  </g>
</svg>
