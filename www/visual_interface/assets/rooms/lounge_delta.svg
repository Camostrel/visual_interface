<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Arial, sans-serif">
  <defs>
    <style>
      .floor-bg { fill: none; }
      .wall-hatch-fill { fill: none; }
      .door-arc { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .door-line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
      .window-glass { fill: none; }
      .window-inner { fill: none; stroke: currentColor; stroke-width: 1.5; }
      .grid-line { stroke: rgba(120,160,200,0.06); stroke-width: 1; }
      .furniture { fill: none; stroke: currentColor; stroke-width: 1.5; }
      .furniture-inner { fill: none; stroke: currentColor; stroke-width: 1; }
      .scale-text { fill: currentColor; font-size: 11px; font-family: Arial, sans-serif; }
      .scale-line { stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
      .compass-text { fill: currentColor; font-size: 10px; font-family: Arial, sans-serif; font-weight: 600; }

      .room-zone {
        fill: transparent;
        stroke: transparent;
        stroke-width: 2;
        pointer-events: all;
        transition: fill 0.2s ease, stroke 0.2s ease;
      }

      .room-label {
        fill: currentColor;
        font-family: Arial, sans-serif;
        font-size: 24px;
        font-weight: 700;
        pointer-events: none;
      }
</style>
    <pattern id="wall-hatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-width="1.5" />
    </pattern>
    <pattern id="floor-tile" x="0" y="0" width="50" height="50" patternUnits="userSpaceOnUse">
      <rect width="50" height="50" fill="none" />
      <rect width="49" height="49" fill="none" stroke="rgba(40,65,95,0.4)" stroke-width="0.5" />
    </pattern>
    <marker id="arrow-end" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="currentColor" />
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 Z" fill="currentColor" />
    </marker>
  </defs>

  <g id="background">
    <line x1="100" y1="0" x2="100" y2="800" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="800" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="800" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="800" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="800" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="800" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="800" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="800" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="800" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="800" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="800" class="grid-line" />
    <line x1="0" y1="100" x2="1200" y2="100" class="grid-line" />
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    <line x1="0" y1="400" x2="1200" y2="400" class="grid-line" />
    <line x1="0" y1="500" x2="1200" y2="500" class="grid-line" />
    <line x1="0" y1="600" x2="1200" y2="600" class="grid-line" />
    <line x1="0" y1="700" x2="1200" y2="700" class="grid-line" />
  </g>

  <g id="walls">
    <rect x="80" y="60" width="1040" height="660" class="wall-hatch-fill" />
    <rect x="80" y="60" width="1040" height="660" fill="none" stroke="currentColor" stroke-width="4" />
    <rect x="100" y="80" width="1000" height="620" fill="url(#floor-tile)" />
    <rect x="100" y="80" width="1000" height="620" fill="none" stroke="#8090a8" stroke-width="1" />

    <rect x="80" y="60" width="20" height="20" fill="#3a5272" stroke="#6080a0" stroke-width="1" />
    <rect x="1100" y="60" width="20" height="20" fill="#3a5272" stroke="#6080a0" stroke-width="1" />
    <rect x="80" y="720" width="20" height="20" fill="#3a5272" stroke="#6080a0" stroke-width="1" />
    <rect x="1100" y="720" width="20" height="20" fill="#3a5272" stroke="#6080a0" stroke-width="1" />

    
    <rect x="1100" y="120" width="20" height="160" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="1110" y1="120" x2="1110" y2="280" class="window-inner" />
    <line x1="1100" y1="200" x2="1120" y2="200" class="window-inner" />

    <rect x="1100" y="360" width="20" height="160" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="1110" y1="360" x2="1110" y2="520" class="window-inner" />
    <line x1="1100" y1="440" x2="1120" y2="440" class="window-inner" />

    <rect x="1100" y="560" width="20" height="140" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="1110" y1="560" x2="1110" y2="700" class="window-inner" />
    <line x1="1100" y1="630" x2="1120" y2="630" class="window-inner" />

    
    <rect x="200" y="720" width="140" height="20" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="200" y1="730" x2="340" y2="730" class="window-inner" />
    <line x1="270" y1="720" x2="270" y2="740" class="window-inner" />

    <rect x="500" y="720" width="140" height="20" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="500" y1="730" x2="640" y2="730" class="window-inner" />
    <line x1="570" y1="720" x2="570" y2="740" class="window-inner" />

    <rect x="800" y="720" width="140" height="20" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="800" y1="730" x2="940" y2="730" class="window-inner" />
    <line x1="870" y1="720" x2="870" y2="740" class="window-inner" />

    
    <rect x="80" y="320" width="20" height="100" fill="url(#floor-tile)" stroke="none" />
    <line x1="80" y1="320" x2="100" y2="320" class="door-line" />
    <line x1="80" y1="420" x2="100" y2="420" class="door-line" />
    <path d="M 100,320 A 100,100 0 0,1 100,420" class="door-arc" />

    
    <line x1="80" y1="752" x2="1120" y2="752" stroke="#2a4060" stroke-width="1" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <text x="600" y="766" text-anchor="middle" class="scale-text">13.0 м</text>

    <line x1="46" y1="80" x2="46" y2="720" stroke="#2a4060" stroke-width="1" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <text x="34" y="403" text-anchor="middle" class="scale-text" transform="rotate(-90,34,403)">8.0 м</text>
  </g>

  <g id="furniture">
    
    
    <rect x="200" y="200" width="500" height="80" rx="10" class="furniture" />
    <rect x="210" y="210" width="480" height="60" rx="8" class="furniture-inner" />
    
    <rect x="200" y="280" width="80" height="200" rx="10" class="furniture" />
    <rect x="210" y="290" width="60" height="180" rx="8" class="furniture-inner" />
    
    <rect x="620" y="280" width="80" height="200" rx="10" class="furniture" />
    <rect x="630" y="290" width="60" height="180" rx="8" class="furniture-inner" />

    
    <rect x="320" y="330" width="260" height="120" rx="8" class="furniture" />
    <rect x="330" y="340" width="240" height="100" rx="6" class="furniture-inner" />

    
    <rect x="920" y="120" width="150" height="300" rx="4" class="furniture" />
    <rect x="928" y="128" width="134" height="284" rx="3" class="furniture-inner" />
    
    <line x1="928" y1="200" x2="1062" y2="200" stroke="#2a4060" stroke-width="1" />
    <line x1="928" y1="280" x2="1062" y2="280" stroke="#2a4060" stroke-width="1" />
    <line x1="928" y1="360" x2="1062" y2="360" stroke="#2a4060" stroke-width="1" />
    
    <circle cx="870" cy="160" r="22" class="furniture" />
    <circle cx="870" cy="160" r="14" class="furniture-inner" />
    <circle cx="870" cy="240" r="22" class="furniture" />
    <circle cx="870" cy="240" r="14" class="furniture-inner" />
    <circle cx="870" cy="320" r="22" class="furniture" />
    <circle cx="870" cy="320" r="14" class="furniture-inner" />
    <circle cx="870" cy="400" r="22" class="furniture" />
    <circle cx="870" cy="400" r="14" class="furniture-inner" />

    
    <rect x="140" y="120" width="14" height="220" rx="2" fill="#1a3050" stroke="#2a5080" stroke-width="2" />

    
    <rect x="180" y="540" width="160" height="100" rx="10" class="furniture" />
    <rect x="192" y="552" width="136" height="76" rx="8" class="furniture-inner" />
    <rect x="420" y="540" width="160" height="100" rx="10" class="furniture" />
    <rect x="432" y="552" width="136" height="76" rx="8" class="furniture-inner" />
    <rect x="660" y="540" width="160" height="100" rx="10" class="furniture" />
    <rect x="672" y="552" width="136" height="76" rx="8" class="furniture-inner" />

    
    <circle cx="160" cy="680" r="24" fill="#142018" stroke="#1e3828" stroke-width="1.5" />
    <circle cx="160" cy="680" r="14" fill="#182820" stroke="none" />
    <circle cx="1060" cy="680" r="24" fill="#142018" stroke="#1e3828" stroke-width="1.5" />
    <circle cx="1060" cy="680" r="14" fill="#182820" stroke="none" />
  </g>

  <g id="room-zones">
    <rect id="room_lounge_delta" class="room-zone" data-room-id="lounge_delta" x="100" y="80" width="1000" height="620" rx="6" />
  </g>

  <g id="room-labels">
    <text id="label_lounge_delta" class="room-label" data-room-id="lounge_delta" x="600" y="760" text-anchor="middle">Лаунж Delta</text>
  </g>

  <g id="technical-lines">
    <rect x="4" y="4" width="1192" height="792" fill="none" stroke="currentColor" stroke-width="2" />
    <rect x="840" y="758" width="350" height="36" fill="none" stroke="currentColor" stroke-width="1" />
    <line x1="960" y1="758" x2="960" y2="794" stroke="currentColor" stroke-width="1" />
    <line x1="1080" y1="758" x2="1080" y2="794" stroke="currentColor" stroke-width="1" />
    <text x="900" y="780" text-anchor="middle" class="scale-text" font-weight="600" font-size="12">ARVID</text>
    <text x="1020" y="774" text-anchor="middle" class="scale-text">Лаунж Delta</text>
    <text x="1020" y="786" text-anchor="middle" class="scale-text">lounge_delta</text>
    <text x="1150" y="780" text-anchor="middle" class="scale-text" fill="#c8d8ec" font-weight="600">Этаж 2</text>

    <line x1="100" y1="762" x2="100" y2="766" class="scale-line" />
    <line x1="100" y1="764" x2="220" y2="764" class="scale-line" />
    <line x1="160" y1="762" x2="160" y2="766" class="scale-line" />
    <line x1="220" y1="762" x2="220" y2="766" class="scale-line" />
    <rect x="100" y="762" width="60" height="4" fill="currentColor" />
    <rect x="160" y="762" width="60" height="4" fill="none" stroke="currentColor" stroke-width="0.5" />
    <text x="100" y="758" text-anchor="middle" class="scale-text">0</text>
    <text x="160" y="758" text-anchor="middle" class="scale-text">3м</text>
    <text x="220" y="758" text-anchor="middle" class="scale-text">6м</text>

    <g transform="translate(270,754)">
      <circle cx="12" cy="-4" r="14" fill="none" stroke="#2a4060" stroke-width="1" />
      <polygon points="12,-16 8,-4 12,0 16,-4" fill="currentColor" />
      <polygon points="12,8 8,-4 12,-8 16,-4" fill="none" stroke="currentColor" stroke-width="0.5" />
      <text x="12" y="-20" text-anchor="middle" class="compass-text">С</text>
      <text x="12" y="18" text-anchor="middle" class="compass-text">Ю</text>
    </g>
  </g>
</svg>