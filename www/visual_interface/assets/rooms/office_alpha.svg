<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Arial, sans-serif">
  <defs>
    <style>
      .floor-bg { fill: none; }
      .floor-fill { fill: none; }

      .wall-hatch-fill { fill: none; }

      .door-arc {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
        stroke-dasharray: 4 3;
      }
      .door-line {
        fill: none;
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .window-glass { fill: none; }
      .window-inner { fill: none; stroke: currentColor; stroke-width: 1.5; }

      .grid-line {
        stroke: rgba(120, 160, 200, 0.06);
        stroke-width: 1;
      }
      .dim-line {
        stroke: currentColor;
        stroke-width: 1;
        stroke-dasharray: 5 3;
      }
      .dim-text {
        fill: currentColor;
        font-size: 11px;
        font-family: Arial, sans-serif;
      }

      /* Интерактивные зоны устройств */

      /* Мебель */
      .furniture {
        fill: none;
        stroke: currentColor;
        stroke-width: 1.5;
      }
      .furniture-inner {
        fill: none;
        stroke: currentColor;
        stroke-width: 1;
      }

      /* Иконки устройств */
      .device-icon-fill {
        fill: none;
        stroke: #4a7090;
        stroke-width: 1.5;
      }

      .room-title {
        fill: currentColor;
        font-family: Arial, sans-serif;
        font-size: 28px;
        font-weight: 700;
        pointer-events: none;
      }
      .room-subtitle {
        fill: currentColor;
        font-family: Arial, sans-serif;
        font-size: 13px;
        letter-spacing: 2px;
        pointer-events: none;
      }

      .scale-text {
        fill: currentColor;
        font-size: 11px;
        font-family: Arial, sans-serif;
      }
      .scale-line {
        stroke: currentColor;
        stroke-width: 2;
        stroke-linecap: round;
      }
      .compass-text {
        fill: currentColor;
        font-size: 10px;
        font-family: Arial, sans-serif;
        font-weight: 600;
      }

      .room-zone {
        fill: transparent;
        stroke: transparent;
        stroke-width: 2;
        pointer-events: all;
        transition: fill 0.2s ease, stroke 0.2s ease;
      }

      .room-label {
        fill: currentColor;
        font-family: Arial, sans-serif;
        font-size: 24px;
        font-weight: 700;
        pointer-events: none;
      }
</style>

    <pattern id="wall-hatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-width="1.5" />
    </pattern>

    <marker id="arrow-end" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="currentColor" />
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 Z" fill="currentColor" />
    </marker>

    
    <pattern id="floor-tile" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" />
      <rect width="39" height="39" fill="none" stroke="rgba(40,65,95,0.4)" stroke-width="0.5" />
    </pattern>
  </defs>

  
  <g id="background">
    
    <line x1="100" y1="0" x2="100" y2="800" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="800" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="800" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="800" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="800" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="800" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="800" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="800" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="800" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="800" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="800" class="grid-line" />
    <line x1="0" y1="100" x2="1200" y2="100" class="grid-line" />
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    <line x1="0" y1="400" x2="1200" y2="400" class="grid-line" />
    <line x1="0" y1="500" x2="1200" y2="500" class="grid-line" />
    <line x1="0" y1="600" x2="1200" y2="600" class="grid-line" />
    <line x1="0" y1="700" x2="1200" y2="700" class="grid-line" />
  </g>

  
  <g id="walls">
    
    <rect x="80" y="60" width="1040" height="660" class="wall-hatch-fill" />
    <rect x="80" y="60" width="1040" height="660" fill="none" stroke="currentColor" stroke-width="4" />

    
    <rect x="100" y="80" width="1000" height="620" fill="url(#floor-tile)" />
    <rect x="100" y="80" width="1000" height="620" fill="none" stroke="#8090a8" stroke-width="1" />

    
    <rect x="80" y="60" width="20" height="20" fill="#3a5272" stroke="#6080a0" stroke-width="1" />
    <rect x="1100" y="60" width="20" height="20" fill="#3a5272" stroke="#6080a0" stroke-width="1" />
    <rect x="80" y="720" width="20" height="20" fill="#3a5272" stroke="#6080a0" stroke-width="1" />
    <rect x="1100" y="720" width="20" height="20" fill="#3a5272" stroke="#6080a0" stroke-width="1" />

    
    <rect x="80" y="140" width="20" height="120" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="90" y1="140" x2="90" y2="260" class="window-inner" />
    <line x1="80" y1="200" x2="100" y2="200" class="window-inner" />

    <rect x="80" y="340" width="20" height="120" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="90" y1="340" x2="90" y2="460" class="window-inner" />
    <line x1="80" y1="400" x2="100" y2="400" class="window-inner" />

    <rect x="80" y="540" width="20" height="120" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="90" y1="540" x2="90" y2="660" class="window-inner" />
    <line x1="80" y1="600" x2="100" y2="600" class="window-inner" />

    
    <rect x="220" y="60" width="140" height="20" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="220" y1="70" x2="360" y2="70" class="window-inner" />
    <line x1="290" y1="60" x2="290" y2="80" class="window-inner" />

    <rect x="500" y="60" width="140" height="20" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="500" y1="70" x2="640" y2="70" class="window-inner" />
    <line x1="570" y1="60" x2="570" y2="80" class="window-inner" />

    <rect x="780" y="60" width="140" height="20" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="780" y1="70" x2="920" y2="70" class="window-inner" />
    <line x1="850" y1="60" x2="850" y2="80" class="window-inner" />

    
    <rect x="1100" y="340" width="20" height="100" fill="url(#floor-tile)" stroke="none" />
    <line x1="1100" y1="340" x2="1120" y2="340" class="door-line" />
    <line x1="1100" y1="440" x2="1120" y2="440" class="door-line" />
    <path d="M 1100,340 A 100,100 0 0,0 1100,440" class="door-arc" />

    
    <line x1="80" y1="752" x2="1120" y2="752" stroke="#2a4060" stroke-width="1" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <text x="600" y="766" text-anchor="middle" class="scale-text">12.5 м</text>

    <line x1="46" y1="80" x2="46" y2="720" stroke="#2a4060" stroke-width="1" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <text x="34" y="403" text-anchor="middle" class="scale-text" transform="rotate(-90,34,403)">7.75 м</text>
  </g>

  
  <g id="furniture">
    
    <rect x="300" y="120" width="320" height="80" class="furniture" />
    <rect x="310" y="130" width="300" height="60" class="furniture-inner" />
    
    <rect x="420" y="122" width="80" height="8" fill="none" stroke="#3a6080" stroke-width="1" />
    <rect x="454" y="128" width="12" height="12" fill="#2a4060" stroke="none" />
    
    <rect x="400" y="210" width="120" height="80" rx="8" class="furniture" />
    <circle cx="460" cy="250" r="28" class="furniture-inner" />

    
    <ellipse cx="580" cy="450" rx="200" ry="110" class="furniture" />
    <ellipse cx="580" cy="450" rx="185" ry="96" class="furniture-inner" />

    
    
    <rect x="430" y="305" width="60" height="35" rx="5" class="furniture" />
    <rect x="550" y="305" width="60" height="35" rx="5" class="furniture" />
    <rect x="670" y="305" width="60" height="35" rx="5" class="furniture" />
    
    <rect x="430" y="560" width="60" height="35" rx="5" class="furniture" />
    <rect x="550" y="560" width="60" height="35" rx="5" class="furniture" />
    <rect x="670" y="560" width="60" height="35" rx="5" class="furniture" />

    
    <rect x="940" y="120" width="130" height="280" class="furniture" />
    <rect x="948" y="128" width="56" height="265" class="furniture-inner" />
    <rect x="1006" y="128" width="56" height="265" class="furniture-inner" />
    
    <circle cx="1001" cy="262" r="4" fill="#3a5472" />
    <circle cx="1009" cy="262" r="4" fill="#3a5472" />

    
    <rect x="180" y="620" width="280" height="70" rx="8" class="furniture" />
    <rect x="188" y="628" width="90" height="54" rx="4" class="furniture-inner" />
    <rect x="286" y="628" width="90" height="54" rx="4" class="furniture-inner" />
    <rect x="384" y="628" width="68" height="54" rx="4" class="furniture-inner" />
    
    <rect x="500" y="635" width="100" height="55" rx="4" class="furniture" />

    
    <rect x="940" y="480" width="80" height="80" class="furniture" />
    <rect x="948" y="488" width="65" height="65" class="furniture-inner" />
  </g>

  
  <g id="room-zones">
    <rect id="room_office_alpha" class="room-zone" data-room-id="office_alpha" x="100" y="80" width="1000" height="620" rx="6" />
  </g>

  
  <g id="room-labels">
    <text id="label_office_alpha" class="room-label" data-room-id="office_alpha" x="600" y="760" text-anchor="middle">Кабинет Alpha</text>
  </g>

  
  <g id="technical-lines">
    <rect x="4" y="4" width="1192" height="792" fill="none" stroke="currentColor" stroke-width="2" />

    
    <rect x="880" y="758" width="310" height="36" fill="none" stroke="currentColor" stroke-width="1" />
    <line x1="980" y1="758" x2="980" y2="794" stroke="currentColor" stroke-width="1" />
    <line x1="1100" y1="758" x2="1100" y2="794" stroke="currentColor" stroke-width="1" />
    <text x="930" y="780" text-anchor="middle" class="scale-text" font-weight="600" font-size="12">ARVID</text>
    <text x="1040" y="776" text-anchor="middle" class="scale-text">Кабинет Alpha</text>
    <text x="1040" y="788" text-anchor="middle" class="scale-text">office_alpha</text>
    <text x="1150" y="780" text-anchor="middle" class="scale-text" fill="#c8d8ec" font-weight="600">Этаж 1</text>

    
    <line x1="100" y1="762" x2="100" y2="766" class="scale-line" />
    <line x1="100" y1="764" x2="220" y2="764" class="scale-line" />
    <line x1="160" y1="762" x2="160" y2="766" class="scale-line" />
    <line x1="220" y1="762" x2="220" y2="766" class="scale-line" />
    <rect x="100" y="762" width="60" height="4" fill="currentColor" />
    <rect x="160" y="762" width="60" height="4" fill="none" stroke="currentColor" stroke-width="0.5" />
    <text x="100" y="758" text-anchor="middle" class="scale-text">0</text>
    <text x="160" y="758" text-anchor="middle" class="scale-text">3м</text>
    <text x="220" y="758" text-anchor="middle" class="scale-text">6м</text>

    
    <g transform="translate(270,754)">
      <circle cx="12" cy="-4" r="14" fill="none" stroke="#2a4060" stroke-width="1" />
      <polygon points="12,-16 8,-4 12,0 16,-4" fill="currentColor" />
      <polygon points="12,8 8,-4 12,-8 16,-4" fill="none" stroke="currentColor" stroke-width="0.5" />
      <text x="12" y="-20" text-anchor="middle" class="compass-text">С</text>
      <text x="12" y="18" text-anchor="middle" class="compass-text">Ю</text>
    </g>

    
    <rect x="20" y="540" width="46" height="200" fill="none" stroke="currentColor" stroke-width="1" />
    <text x="43" y="558" text-anchor="middle" class="scale-text" font-size="10" font-weight="600">УСТ.</text>
    
    <circle cx="43" cy="578" r="10" fill="#1e2e40" stroke="#6a9040" stroke-width="1.5" />
    <text x="43" y="598" text-anchor="middle" class="scale-text" font-size="9">Свет</text>
    
    <rect x="33" y="610" width="20" height="12" rx="2" fill="#1a2a3e" stroke="#3a7060" stroke-width="1.5" />
    <text x="43" y="634" text-anchor="middle" class="scale-text" font-size="9">Климат</text>
    
    <circle cx="43" cy="650" r="8" fill="#1a2a3e" stroke="#5cc8ff" stroke-width="1.5" />
    <text x="43" y="672" text-anchor="middle" class="scale-text" font-size="9">Датчик</text>
    
    <rect x="33" y="684" width="20" height="14" rx="2" fill="#1a2a3e" stroke="#4a6880" stroke-width="1.5" />
    <text x="43" y="710" text-anchor="middle" class="scale-text" font-size="9">Выкл.</text>
    
    <circle cx="43" cy="724" r="8" fill="#1a2a3e" stroke="#4a6880" stroke-width="1.5" />
    <text x="43" y="744" text-anchor="middle" class="scale-text" font-size="9">Розетка</text>
  </g>

</svg>