<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="Arial, sans-serif">
  <defs>
    <style>
      .floor-bg { fill: none; }
      .wall-hatch-fill { fill: none; }
      .door-arc { fill: none; stroke: currentColor; stroke-width: 1.5; stroke-dasharray: 4 3; }
      .door-line { fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
      .window-glass { fill: none; }
      .window-inner { fill: none; stroke: currentColor; stroke-width: 1.5; }
      .grid-line { stroke: rgba(120,160,200,0.06); stroke-width: 1; }
      .dim-line { stroke: currentColor; stroke-width: 1; stroke-dasharray: 5 3; }
      .dim-text { fill: currentColor; font-size: 11px; font-family: Arial, sans-serif; }

      .furniture { fill: none; stroke: currentColor; stroke-width: 1.5; }
      .furniture-inner { fill: none; stroke: currentColor; stroke-width: 1; }

      .scale-text { fill: currentColor; font-size: 11px; font-family: Arial, sans-serif; }
      .scale-line { stroke: currentColor; stroke-width: 2; stroke-linecap: round; }
      .compass-text { fill: currentColor; font-size: 10px; font-family: Arial, sans-serif; font-weight: 600; }

      .room-zone {
        fill: transparent;
        stroke: transparent;
        stroke-width: 2;
        pointer-events: all;
        transition: fill 0.2s ease, stroke 0.2s ease;
      }

      .room-label {
        fill: currentColor;
        font-family: Arial, sans-serif;
        font-size: 24px;
        font-weight: 700;
        pointer-events: none;
      }
</style>

    <pattern id="wall-hatch" x="0" y="0" width="8" height="8" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="8" stroke="currentColor" stroke-width="1.5" />
    </pattern>
    <pattern id="floor-tile" x="0" y="0" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect width="40" height="40" fill="none" />
      <rect width="39" height="39" fill="none" stroke="rgba(40,65,95,0.4)" stroke-width="0.5" />
    </pattern>
    <marker id="arrow-end" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 Z" fill="currentColor" />
    </marker>
    <marker id="arrow-start" markerWidth="8" markerHeight="8" refX="2" refY="3" orient="auto-start-reverse">
      <path d="M0,0 L0,6 L8,3 Z" fill="currentColor" />
    </marker>
  </defs>

  <g id="background">
    <line x1="100" y1="0" x2="100" y2="800" class="grid-line" />
    <line x1="200" y1="0" x2="200" y2="800" class="grid-line" />
    <line x1="300" y1="0" x2="300" y2="800" class="grid-line" />
    <line x1="400" y1="0" x2="400" y2="800" class="grid-line" />
    <line x1="500" y1="0" x2="500" y2="800" class="grid-line" />
    <line x1="600" y1="0" x2="600" y2="800" class="grid-line" />
    <line x1="700" y1="0" x2="700" y2="800" class="grid-line" />
    <line x1="800" y1="0" x2="800" y2="800" class="grid-line" />
    <line x1="900" y1="0" x2="900" y2="800" class="grid-line" />
    <line x1="1000" y1="0" x2="1000" y2="800" class="grid-line" />
    <line x1="1100" y1="0" x2="1100" y2="800" class="grid-line" />
    <line x1="0" y1="100" x2="1200" y2="100" class="grid-line" />
    <line x1="0" y1="200" x2="1200" y2="200" class="grid-line" />
    <line x1="0" y1="300" x2="1200" y2="300" class="grid-line" />
    <line x1="0" y1="400" x2="1200" y2="400" class="grid-line" />
    <line x1="0" y1="500" x2="1200" y2="500" class="grid-line" />
    <line x1="0" y1="600" x2="1200" y2="600" class="grid-line" />
    <line x1="0" y1="700" x2="1200" y2="700" class="grid-line" />
  </g>

  <g id="walls">
    <rect x="80" y="60" width="1040" height="660" class="wall-hatch-fill" />
    <rect x="80" y="60" width="1040" height="660" fill="none" stroke="currentColor" stroke-width="4" />
    <rect x="100" y="80" width="1000" height="620" fill="url(#floor-tile)" />
    <rect x="100" y="80" width="1000" height="620" fill="none" stroke="#8090a8" stroke-width="1" />

    
    <rect x="80" y="60" width="20" height="20" fill="#3a5272" stroke="#6080a0" stroke-width="1" />
    <rect x="1100" y="60" width="20" height="20" fill="#3a5272" stroke="#6080a0" stroke-width="1" />
    <rect x="80" y="720" width="20" height="20" fill="#3a5272" stroke="#6080a0" stroke-width="1" />
    <rect x="1100" y="720" width="20" height="20" fill="#3a5272" stroke="#6080a0" stroke-width="1" />

    
    <rect x="160" y="60" width="140" height="20" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="160" y1="70" x2="300" y2="70" class="window-inner" />
    <line x1="230" y1="60" x2="230" y2="80" class="window-inner" />

    <rect x="440" y="60" width="140" height="20" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="440" y1="70" x2="580" y2="70" class="window-inner" />
    <line x1="510" y1="60" x2="510" y2="80" class="window-inner" />

    <rect x="720" y="60" width="140" height="20" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="720" y1="70" x2="860" y2="70" class="window-inner" />
    <line x1="790" y1="60" x2="790" y2="80" class="window-inner" />

    <rect x="920" y="60" width="140" height="20" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="920" y1="70" x2="1060" y2="70" class="window-inner" />
    <line x1="990" y1="60" x2="990" y2="80" class="window-inner" />

    
    <rect x="1100" y="140" width="20" height="120" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="1110" y1="140" x2="1110" y2="260" class="window-inner" />
    <line x1="1100" y1="200" x2="1120" y2="200" class="window-inner" />

    <rect x="1100" y="340" width="20" height="120" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="1110" y1="340" x2="1110" y2="460" class="window-inner" />
    <line x1="1100" y1="400" x2="1120" y2="400" class="window-inner" />

    <rect x="1100" y="540" width="20" height="120" class="window-glass" stroke="#3a7ca8" stroke-width="3" />
    <line x1="1110" y1="540" x2="1110" y2="660" class="window-inner" />
    <line x1="1100" y1="600" x2="1120" y2="600" class="window-inner" />

    
    <rect x="80" y="340" width="20" height="100" fill="url(#floor-tile)" stroke="none" />
    <line x1="80" y1="340" x2="100" y2="340" class="door-line" />
    <line x1="80" y1="440" x2="100" y2="440" class="door-line" />
    <path d="M 100,340 A 100,100 0 0,1 100,440" class="door-arc" />

    
    <rect x="100" y="260" width="16" height="220" fill="#1a3050" stroke="#2a5080" stroke-width="2" />
    <rect x="104" y="268" width="8" height="204" fill="none" stroke="none" />

    
    <line x1="80" y1="752" x2="1120" y2="752" stroke="#2a4060" stroke-width="1" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <text x="600" y="766" text-anchor="middle" class="scale-text">14.0 м</text>

    <line x1="46" y1="80" x2="46" y2="720" stroke="#2a4060" stroke-width="1" marker-start="url(#arrow-start)" marker-end="url(#arrow-end)" />
    <text x="34" y="403" text-anchor="middle" class="scale-text" transform="rotate(-90,34,403)">8.0 м</text>
  </g>

  <g id="furniture">
    
    <rect x="260" y="240" width="680" height="310" rx="12" class="furniture" />
    <rect x="270" y="250" width="660" height="290" rx="10" class="furniture-inner" />
    
    <line x1="260" y1="395" x2="940" y2="395" stroke="#2a4060" stroke-width="0.8" />

    
    <rect x="270" y="185" width="58" height="45" rx="5" class="furniture" />
    <rect x="346" y="185" width="58" height="45" rx="5" class="furniture" />
    <rect x="422" y="185" width="58" height="45" rx="5" class="furniture" />
    <rect x="498" y="185" width="58" height="45" rx="5" class="furniture" />
    <rect x="574" y="185" width="58" height="45" rx="5" class="furniture" />
    <rect x="650" y="185" width="58" height="45" rx="5" class="furniture" />
    <rect x="726" y="185" width="58" height="45" rx="5" class="furniture" />
    <rect x="802" y="185" width="58" height="45" rx="5" class="furniture" />

    
    <rect x="270" y="560" width="58" height="45" rx="5" class="furniture" />
    <rect x="346" y="560" width="58" height="45" rx="5" class="furniture" />
    <rect x="422" y="560" width="58" height="45" rx="5" class="furniture" />
    <rect x="498" y="560" width="58" height="45" rx="5" class="furniture" />
    <rect x="574" y="560" width="58" height="45" rx="5" class="furniture" />
    <rect x="650" y="560" width="58" height="45" rx="5" class="furniture" />
    <rect x="726" y="560" width="58" height="45" rx="5" class="furniture" />
    <rect x="802" y="560" width="58" height="45" rx="5" class="furniture" />

    
    <rect x="195" y="270" width="55" height="58" rx="5" class="furniture" />
    <rect x="195" y="360" width="55" height="58" rx="5" class="furniture" />
    <rect x="195" y="450" width="55" height="58" rx="5" class="furniture" />

    
    <rect x="950" y="270" width="55" height="58" rx="5" class="furniture" />
    <rect x="950" y="360" width="55" height="58" rx="5" class="furniture" />
    <rect x="950" y="450" width="55" height="58" rx="5" class="furniture" />

    
    <rect x="1010" y="640" width="80" height="60" class="furniture" />
    <rect x="1018" y="648" width="64" height="44" class="furniture-inner" />

    
    <rect x="540" y="100" width="220" height="60" rx="4" fill="none" stroke="#3a5472" stroke-width="1.5" />
    <rect x="550" y="108" width="200" height="44" rx="3" fill="none" stroke="#2a4060" stroke-width="1" />
    <line x1="550" y1="120" x2="750" y2="120" stroke="currentColor" stroke-width="1" />
    <line x1="550" y1="130" x2="750" y2="130" stroke="currentColor" stroke-width="1" />
    <line x1="550" y1="140" x2="750" y2="140" stroke="currentColor" stroke-width="1" />
    <text x="650" y="160" text-anchor="middle" fill="currentColor" font-size="11" font-family="Arial,sans-serif">ПРОЕКТОР</text>
  </g>

  <g id="room-zones">
    <rect id="room_meeting_beta" class="room-zone" data-room-id="meeting_beta" x="100" y="80" width="1000" height="620" rx="6" />
  </g>

  <g id="room-labels">
    <text id="label_meeting_beta" class="room-label" data-room-id="meeting_beta" x="600" y="760" text-anchor="middle">Переговорная Beta</text>
  </g>

  <g id="technical-lines">
    <rect x="4" y="4" width="1192" height="792" fill="none" stroke="currentColor" stroke-width="2" />
    <rect x="840" y="758" width="350" height="36" fill="none" stroke="currentColor" stroke-width="1" />
    <line x1="960" y1="758" x2="960" y2="794" stroke="currentColor" stroke-width="1" />
    <line x1="1080" y1="758" x2="1080" y2="794" stroke="currentColor" stroke-width="1" />
    <text x="900" y="780" text-anchor="middle" class="scale-text" font-weight="600" font-size="12">ARVID</text>
    <text x="1020" y="774" text-anchor="middle" class="scale-text">Переговорная Beta</text>
    <text x="1020" y="786" text-anchor="middle" class="scale-text">meeting_beta</text>
    <text x="1150" y="780" text-anchor="middle" class="scale-text" fill="#c8d8ec" font-weight="600">Этаж 1</text>

    <line x1="100" y1="762" x2="100" y2="766" class="scale-line" />
    <line x1="100" y1="764" x2="220" y2="764" class="scale-line" />
    <line x1="160" y1="762" x2="160" y2="766" class="scale-line" />
    <line x1="220" y1="762" x2="220" y2="766" class="scale-line" />
    <rect x="100" y="762" width="60" height="4" fill="currentColor" />
    <rect x="160" y="762" width="60" height="4" fill="none" stroke="currentColor" stroke-width="0.5" />
    <text x="100" y="758" text-anchor="middle" class="scale-text">0</text>
    <text x="160" y="758" text-anchor="middle" class="scale-text">3м</text>
    <text x="220" y="758" text-anchor="middle" class="scale-text">6м</text>

    <g transform="translate(270,754)">
      <circle cx="12" cy="-4" r="14" fill="none" stroke="#2a4060" stroke-width="1" />
      <polygon points="12,-16 8,-4 12,0 16,-4" fill="currentColor" />
      <polygon points="12,8 8,-4 12,-8 16,-4" fill="none" stroke="currentColor" stroke-width="0.5" />
      <text x="12" y="-20" text-anchor="middle" class="compass-text">С</text>
      <text x="12" y="18" text-anchor="middle" class="compass-text">Ю</text>
    </g>
  </g>
</svg>